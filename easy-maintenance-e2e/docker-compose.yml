version: "3.9"

# Starts MySQL and MailHog for E2E tests.
# The API is started separately (see README).
# Use port 3307/1026 to avoid conflicts with local dev containers.

services:
  mysql-e2e:
    image: mysql:8.0
    container_name: e2e_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: easy_maintenance
      MYSQL_USER: easy_user
      MYSQL_PASSWORD: easy_pass
      TZ: "UTC"
    ports:
      - "3307:3306"
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--explicit_defaults_for_timestamp=1"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "easy_user", "-peasy_pass"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - mysql_e2e_data:/var/lib/mysql

  mailhog-e2e:
    image: mailhog/mailhog:latest
    container_name: e2e_mailhog
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  mysql_e2e_data:
